<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image" href="https://i.postimg.cc/WbvxWtX3/2023-11-08-0yk-Kleki.png">
    <title>TS_SKER</title>
    <style>
        body {
            scroll-behavior: smooth;
            font-family: Arial, sans-serif;
            background-color: #121212;
            margin: 0;
            padding: 0;
            color: #334318;
            min-height: 100vh;
        }
        
        .header {
            position: relative;
            height: 100vh;
            margin: 0;
            border: none;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
        }
        
        .header-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #1a1712;
            z-index: -1;
        }
        
        .header-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: clamp(1.2rem, 10vw, 6rem);
            text-shadow: 2px 2px 4px #fff;
            padding: 10px 20px;
            background-color: rgba(129, 19, 139, 0.5);
            border-radius: 10px;
            white-space: nowrap;
            width: auto;
            text-align: center;
        }
        
        .header-bg {
            position: relative;
            height: 100vh;
            background-image: url('https://i.postimg.cc/524bv9Cm/splinWeb.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .content {
            background-color: #111;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .game-container {
            width: min(80vw, 800px);
            height: min(60vh, 600px);
            min-width: 300px;
            min-height: 300px;
            background-color: #f0fff0;
            border: 5px solid #6b8e23;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(1rem, 2vw, 1.5rem);
            color: #0a0603;
            margin: 40px auto;
        }
        
        .scroll-wrapper {
            position: relative;
            margin: 10px;
            width: calc(100% - 20px);
        }
        
        .image-scroll {
            overflow-x: auto;
            white-space: nowrap;
            padding: 20px 0;
            scroll-behavior: smooth;
            width: 100%;
            scrollbar-width: none;
        }
        
        .image-scroll::-webkit-scrollbar {
            height: 14px;
        }
        
        .image-scroll::-webkit-scrollbar-thumb {
            background-color: #8fbc8f;
            border-radius: 4px;
        }
        
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: min(50vw, 400px);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 2;
            transition: background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            outline: none;
        }
        
        .arrow:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
        
        .left-arrow {
            left: 0;
            border-radius: 10px 0 0 10px;
        }
        
        .right-arrow {
            right: 0;
            border-radius: 0 10px 10px 0;
        }
        
        .image-block {
            display: inline-block;
            width: min(50vw, 400px);
            height: min(50vw, 400px);
            margin: 0 10px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        
        .image-block:hover {
            transform: scale(1.1);
        }

        .transparante { background-color: #00000000; }
        .block1 { background-color: #d2b48c; }
        .block2 { background-color: #bdb76b; }
        .block3 { background-color: #8fbc8f; }
        .block4 { background-color: #9acd32; }
        .block5 { background-color: #556b2f; }
        .block6 { background-color: #f5deb3; }
        .block7 { background-color: #daa520; }
        .block8 { background-color: #6b8e23; }
        
        @media (max-width: 768px) {
            .arrow {
                width: 30px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="header-bg">
        <h1 class="header-title">Сайт для души</h1>
    </div>
    
    <div class="content">
        <div class="game-container">
            Здесь будет мини-игра
        </div>
        
        <div class="scroll-wrapper">
            <div class="left-arrow arrow">&lt;</div>
            <div class="image-scroll">
                <div class="image-block transparante"></div>
                <div class="image-block transparante"></div>
                <div class="image-block block1"></div>
                <div class="image-block block2"></div>
                <div class="image-block block3"></div>
                <div class="image-block block4"></div>
                <div class="image-block block5"></div>
                <div class="image-block block6"></div>
                <div class="image-block block7"></div>
                <div class="image-block block8"></div>
                <div class="image-block transparante"></div>
                <div class="image-block transparante"></div>
            </div>
            <div class="right-arrow arrow">&gt;</div>
        </div>
    </div>
</body>
<script src="simple.js"></script>
</html>
